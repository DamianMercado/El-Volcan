<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Volcan - Login</title>
    <link rel="stylesheet" href="css/loginstyle.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav>
        <div>
            <a href="index.html">
                <img src="img/logo.svg" alt="El Volcán Logo">
                <span>El Volcán</span><br>
                <span>Gas & Energía</span>
            </a>
        </div>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="login.html">Iniciar Sesión</a></li>
        </ul>
    </nav>

    <!-- Card Login -->

    <main>
        <div>
            <div>
                <h1>Iniciar Sesión</h1>
                <p>Accede a tu cuenta de El Volcán</p>
            </div>
            <form>

                <div>
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@gmail.com" required>
                </div>

                <div>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <div>
                    <label>
                        <input type="checkbox" name="recordar"> Recordarme
                    </label>
                    <a href="recuperar-contraseña.html">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </main>
    
</body>
</html>
