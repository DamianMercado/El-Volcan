server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      mvc:
        routes:
          - id: ms-auth
            uri: lb://ms-auth
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - RemoveResponseHeader=Access-Control-Allow-Origin
              - RemoveResponseHeader=Access-Control-Allow-Credentials

          - id: ms-usuario
            uri: lb://ms-usuario
            predicates:
              - Path=/api/v1/usuarios/**
            filters:
              - RemoveResponseHeader=Access-Control-Allow-Origin
              - RemoveResponseHeader=Access-Control-Allow-Credentials

          - id: ms-inventario
            uri: lb://ms-inventario
            predicates:
              - Path=/api/v1/inventario/**
            filters:
              - RemoveResponseHeader=Access-Control-Allow-Origin
              - RemoveResponseHeader=Access-Control-Allow-Credentials

          - id: ms-catalogo
            uri: lb://ms-catalogo
            predicates:
              - Path=/api/v1/catalogo/**,/api/v1/productos/**
            filters:
              - RemoveResponseHeader=Access-Control-Allow-Origin
              - RemoveResponseHeader=Access-Control-Allow-Credentials

          - id: ms-venta
            uri: lb://ms-venta
            predicates:
              - Path=/api/v1/ventas/**
            filters:
              - RemoveResponseHeader=Access-Control-Allow-Origin
              - RemoveResponseHeader=Access-Control-Allow-Credentials

          - id: ms-pago
            uri: lb://ms-pago
            predicates:
              - Path=/api/v1/pagos/**
            filters:
              - RemoveResponseHeader=Access-Control-Allow-Origin
              - RemoveResponseHeader=Access-Control-Allow-Credentials

          # ==================== RUTAS OPENAPI (SWAGGER CENTRALIZADO EN :8080) ====================
          - id: openapi-ms-auth
            uri: lb://ms-auth
            predicates:
              - Path=/v3/api-docs/ms-auth
            filters:
              - SetPath=/v3/api-docs

          - id: openapi-ms-usuario
            uri: lb://ms-usuario
            predicates:
              - Path=/v3/api-docs/ms-usuario
            filters:
              - SetPath=/v3/api-docs

          - id: openapi-ms-catalogo
            uri: lb://ms-catalogo
            predicates:
              - Path=/v3/api-docs/ms-catalogo
            filters:
              - SetPath=/v3/api-docs

          - id: openapi-ms-inventario
            uri: lb://ms-inventario
            predicates:
              - Path=/v3/api-docs/ms-inventario
            filters:
              - SetPath=/v3/api-docs

          - id: openapi-ms-venta
            uri: lb://ms-venta
            predicates:
              - Path=/v3/api-docs/ms-venta
            filters:
              - SetPath=/v3/api-docs

          - id: openapi-ms-pago
            uri: lb://ms-pago
            predicates:
              - Path=/v3/api-docs/ms-pago
            filters:
              - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html
    urls:
      - name: 1. Autenticación JWT (ms-auth)
        url: /v3/api-docs/ms-auth
      - name: 2. Usuarios (ms-usuario)
        url: /v3/api-docs/ms-usuario
      - name: 3. Catálogo y Productos (ms-catalogo)
        url: /v3/api-docs/ms-catalogo
      - name: 4. Inventario y Stock (ms-inventario)
        url: /v3/api-docs/ms-inventario
      - name: 5. Ventas y Seguimiento (ms-venta)
        url: /v3/api-docs/ms-venta
      - name: 6. Pagos (ms-pago)
        url: /v3/api-docs/ms-pago

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,*}

eureka:
  client:
    restclient:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.elvolcan.gateway: INFO

spring.cloud.compatibility-verifier.enabled: false
