server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      mvc:
        routes:
          - id: ms-auth
            uri: lb://ms-auth
            predicates:
              - Path=/api/v1/auth/**

          - id: ms-usuario
            uri: lb://ms-usuario
            predicates:
              - Path=/api/v1/usuarios/**

          - id: ms-inventario
            uri: lb://ms-inventario
            predicates:
              - Path=/api/v1/inventario/**

          - id: ms-catalogo
            uri: lb://ms-catalogo
            predicates:
              - Path=/api/v1/catalogo/**,/api/v1/productos/**

          - id: ms-venta
            uri: lb://ms-venta
            predicates:
              - Path=/api/v1/ventas/**

          - id: ms-pago
            uri: lb://ms-pago
            predicates:
              - Path=/api/v1/pagos/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,*}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.elvolcan.gateway: INFO

spring.cloud.compatibility-verifier.enabled: false
